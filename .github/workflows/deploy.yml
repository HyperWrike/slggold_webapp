name: Deploy Convex Backend

# Frontend (Expo web) is deployed automatically by Vercel's Git integration.
# This workflow only ships the Convex backend on pushes to main.

on:
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test

      - name: Deploy Convex Functions to Production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy -y
